<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Garna · Статистика воронок</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2226%22 fill=%22%230D5A50%22/><rect x=%2224%22 y=%2254%22 width=%2213%22 height=%2224%22 rx=%223%22 fill=%22white%22 opacity=%22.55%22/><rect x=%2244%22 y=%2238%22 width=%2213%22 height=%2240%22 rx=%223%22 fill=%22white%22 opacity=%22.8%22/><rect x=%2264%22 y=%2222%22 width=%2213%22 height=%2256%22 rx=%223%22 fill=%22white%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){try{
  var t=localStorage.getItem('theme');
  var d=document.documentElement;
  var sys=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  d.setAttribute('data-theme', t==='auto' ? (sys?'dark':'light') : (t==='dark'?'dark':'light'));
}catch(e){}})();
</script>
<style>
  :root{
    color-scheme:light;
    /* Графит: хром нейтральный, цвет живёт только в данных и статусах */
    --bg:#F5F5F6; --card:#FFFFFF; --ink:#17191B; --ink-rgb:23,25,27;
    --petrol:#3B565B; --petrol-soft:#C2CDCE;
    --c-meeting:#1C6A55; --c-positive:#35A07E; --c-referral:#79C4AA;
    --c-deferred:#C89A3C; --c-neutral:#B7BDBC; --c-refused:#C4634A; --c-optout:#8A3A28;
    --v-dev-bg:rgba(28,106,85,.12); --v-dev:#1E7A5E;
    --v-fix-bg:rgba(200,154,60,.20); --v-fix:#936D25; --v-fix-bg2:rgba(200,154,60,.28);
    --v-stop-bg:rgba(196,99,74,.16); --v-stop:#A54B33;
    --dwrap-bg:#FAFAFB; --os-bg:#FFFFFF; --tip-bg:rgba(23,25,27,.92); --tip-ink:#F3F4F4;
    --glass:rgba(255,255,255,.72); --sk1:#EEEFF0; --sk2:#F8F9F9; --modal-bg:#FFFFFF;
    --scrim:20,22,24; --scrim-a:.42;
    --shadow-card:0 20px 60px rgba(20,22,24,.25); --shadow-float:0 6px 20px rgba(20,22,24,.12);
    /* всё серое выводится из одного чернильного цвета альфой,
       поэтому смена палитры - это смена нескольких переменных, а не сорока */
    --sub:rgba(var(--ink-rgb),.56); --sub2:rgba(var(--ink-rgb),.36);
    --line:rgba(var(--ink-rgb),.11); --line-strong:rgba(var(--ink-rgb),.17);
    --track:rgba(var(--ink-rgb),.08); --hover:rgba(var(--ink-rgb),.04);
    --bar1:rgba(var(--ink-rgb),.08); --bar2:rgba(var(--ink-rgb),.15);
    --grab:rgba(var(--ink-rgb),.20);
    --v-low-bg:rgba(var(--ink-rgb),.07); --v-low:rgba(var(--ink-rgb),.5);
    --ease:cubic-bezier(.22,.8,.24,1);
    --hair:1px; --r-card:14px; --r-sm:9px;
  }
  :root[data-theme="dark"]{ color-scheme:dark;
    --bg:#0F1011; --card:#191B1D; --ink:#E9EAEB; --ink-rgb:233,234,235;
    --petrol:#9FBDC0; --petrol-soft:#38494C;
    --c-meeting:#2E9B7F; --c-positive:#4FBC9C; --c-referral:#86D0B8;
    --c-deferred:#D9AE5F; --c-neutral:#7C8482; --c-refused:#DE7C5F; --c-optout:#A8543C;
    --v-dev-bg:rgba(79,188,156,.16); --v-dev:#5CC6A2;
    --v-fix-bg:rgba(217,174,95,.16); --v-fix:#E2B76F; --v-fix-bg2:rgba(217,174,95,.24);
    --v-stop-bg:rgba(222,124,95,.16); --v-stop:#EC9077;
    --dwrap-bg:#1D1F21; --os-bg:#232628; --tip-bg:rgba(56,59,62,.94); --tip-ink:#F0F1F1;
    --glass:rgba(32,35,37,.72); --sk1:#1B1D1F; --sk2:#242628; --modal-bg:#212426;
    --scrim:0,0,0; --scrim-a:.62;
    --shadow-card:0 24px 70px rgba(0,0,0,.6); --shadow-float:0 8px 24px rgba(0,0,0,.45);
  }
  body,.row,.tot,.totals,.dwrap,.os,.modal,.lcard,.empty,.sk,.tip{transition:background-color .3s ease,color .3s ease}
  /* На ретине рамки становятся настоящими волосяными линиями */
  @media(min-resolution:1.5dppx){ :root{--hair:0.5px} }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;letter-spacing:-0.005em;padding:34px 20px 72px;-webkit-font-smoothing:antialiased}
  /* цифры табличные - колонки не пляшут при обновлении */
  .tot .val,.nums b,.posline b,.cline .cnum,.oline .onum,.cbench,.os b,.fprog,.uuid{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1}
  .wrap{max-width:1060px;margin:0 auto}
  .mono{font-variant-numeric:tabular-nums}
  a{color:var(--petrol)}
  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  h1{font-weight:600;font-size:28px;line-height:1.12;letter-spacing:-0.028em}
  h1 .dot{color:var(--petrol)}
  .runmeta{color:var(--sub);font-size:13px}
  header{gap:10px 18px;align-items:center}
  .hright{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  /* Переключатель темы: видны все три варианта, бегунок едет пружиной */
  .seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--track);border-radius:99px;padding:2px;isolation:isolate;user-select:none;flex:none}
  .seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:40px;border-radius:99px;background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.10),0 0 0 var(--hair) var(--line);z-index:0;will-change:transform,width}
  .seg button{position:relative;z-index:1;background:none;border:0;padding:5px 11px;font-size:12px;font-weight:500;letter-spacing:0;color:var(--sub);border-radius:99px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px;transition:color .18s}
  .seg button[aria-pressed="true"]{font-weight:600;color:var(--ink)}
  .seg button:hover{color:var(--ink)}
  .seg button:focus-visible{outline:2px solid var(--petrol);outline-offset:1px}
  .seg svg{width:14px;height:14px;display:block;flex:none}
  @media(max-width:640px){ .seg .lab{display:none} .seg button{padding:6px 12px} }
  .runmeta b{color:var(--ink);font-weight:600}
  .empty{background:var(--card);border-radius:var(--r-card);box-shadow:0 0 0 var(--hair) var(--line);padding:44px 24px;text-align:center;color:var(--sub);margin-top:26px}
  /* Сводка - один блок, ячейки разделены волосяными линиями, а не пять карточек */
  .totals{display:grid;grid-template-columns:repeat(5,1fr);margin:24px 0 30px;background:var(--card);border-radius:var(--r-card);box-shadow:0 0 0 var(--hair) var(--line);overflow:hidden;opacity:0;transform:translateY(6px);animation:rise .5s var(--ease) forwards}
  .tot{padding:15px 16px 17px;position:relative;transition:background-color .16s}
  .tot + .tot{box-shadow:inset var(--hair) 0 0 var(--line)}
  @keyframes rise{to{opacity:1;transform:none}}
  .tot .lbl{color:var(--sub);font-size:12px;margin-bottom:4px}
  .tot .val{font-weight:600;font-size:26px;line-height:1.1;letter-spacing:-0.026em}
  .tot .val small{font-size:13px;color:var(--sub);font-weight:500;margin-left:4px}
  .tot.hero .val{color:var(--petrol)}
  h2{font-weight:600;font-size:17px;line-height:1.25;letter-spacing:-0.016em;margin:32px 0 14px}
  h2 span{color:var(--sub);font-weight:400;font-size:13px;letter-spacing:-0.002em;margin-left:10px}
  .rows{display:flex;flex-direction:column;gap:9px}
  .row{background:var(--card);border-radius:var(--r-card);overflow:hidden;box-shadow:0 0 0 var(--hair) var(--line);transition:box-shadow .25s}
  .row:hover{box-shadow:0 0 0 var(--hair) var(--line-strong), 0 1px 3px rgba(0,0,0,.04)}
  .row.open{box-shadow:0 0 0 var(--hair) var(--petrol-soft), 0 6px 20px rgba(13,90,80,.07)}
  .head{width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;padding:16px;display:grid;grid-template-columns:270px 1fr 170px 134px 18px;gap:16px;align-items:center}
  .head:focus-visible{outline:2px solid var(--petrol);outline-offset:-2px;border-radius:10px}
  .fname{font-weight:600;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
  .fname .sep{color:var(--sub2);font-weight:400;margin:0 4px}
  .fprog{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:99px;background:var(--track);color:var(--sub);font-size:11px;font-weight:600;letter-spacing:0;vertical-align:1px;white-space:nowrap;cursor:help}
  .fprog.hi{background:var(--v-dev-bg);color:var(--v-dev)}
  .fprog.lo{background:var(--v-fix-bg);color:var(--v-fix)}
  .bar{position:relative;height:14px;background:var(--track);border-radius:7px;overflow:hidden;display:block}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px 0 0 7px;width:0;will-change:width}
  .fill.acc{background:var(--petrol-soft)}
  .fill.rep{background:var(--petrol)}
  .nums{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden}
  .nums b{color:var(--ink);font-weight:600}
  .stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--track);gap:1.5px}
  .stack i{display:block;height:100%;flex-grow:0;flex-shrink:0;flex-basis:0%;will-change:flex-basis}
  .posline{margin-top:6px;font-size:12px;color:var(--sub);white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .posline b{color:var(--ink);font-weight:600}
  .verdict{justify-self:end;text-align:right}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;letter-spacing:0}
  .chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .chip.dev{background:var(--v-dev-bg);color:var(--v-dev)}
  .chip.fix{background:var(--v-fix-bg);color:var(--v-fix)}
  .chip.stop{background:var(--v-stop-bg);color:var(--v-stop)}
  .chip.low{background:var(--v-low-bg);color:var(--v-low)}
  .why{color:var(--sub);font-size:11.5px;margin-top:5px;line-height:1.35;display:block}
  .chev{width:18px;height:18px;justify-self:end;position:relative;will-change:transform}
  .chev::before{content:"";position:absolute;left:4px;top:5px;width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg)}
  .detail{height:0;overflow:hidden;will-change:height}
  .dinner{overflow:hidden}
  .dwrap{box-shadow:inset 0 var(--hair) 0 var(--line);padding:18px 16px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .dverdict{grid-column:1/-1;display:flex;gap:12px;align-items:flex-start;border-bottom:1px dashed var(--line);padding-bottom:12px}
  .dverdict .chip{flex:none}
  .dverdict .dwhy{font-size:12.5px;color:var(--sub);line-height:1.5;padding-top:2px}
  .dh{font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--sub);text-transform:uppercase;margin-bottom:10px}
  .cline{display:grid;grid-template-columns:86px 1fr 92px;gap:10px;align-items:center;margin-bottom:8px;font-size:12px}
  .cline .clbl{color:var(--sub)}
  .cline .bar{height:10px}
  .cline .fill{border-radius:5px 0 0 5px}
  .cline .cnum{font-weight:600;text-align:right;white-space:nowrap}
  .cline .cnum small{color:var(--sub);font-weight:500;margin-left:4px}
  .oline{display:grid;grid-template-columns:86px 1fr 34px;gap:10px;align-items:center;margin-bottom:7px;font-size:12px}
  .oline .olbl{color:var(--sub);display:flex;align-items:center;gap:6px}
  .oline .olbl i{width:8px;height:8px;border-radius:50%;flex:none}
  .oline .bar{height:10px}
  .oline .fill{border-radius:5px 0 0 5px}
  .oline .onum{font-weight:600;text-align:right}
  .oline.zero{opacity:.45}
  .flink{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:12.5px;border-top:1px dashed var(--line);padding-top:12px}
  .flink a{font-weight:600;text-decoration:none;border-radius:99px;padding:7px 14px;box-shadow:0 0 0 var(--hair) var(--petrol-soft);transition:background .18s,box-shadow .18s,transform .12s var(--ease)}
  .flink a:hover{background:var(--v-dev-bg);box-shadow:0 0 0 var(--hair) var(--petrol)}
  .flink .uuid{color:var(--sub);font-size:11px}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--sub)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .tot.clickable{cursor:pointer}
  .tot.clickable:hover{background:var(--hover)}
  .tot .more{font-size:11.5px;color:var(--petrol);margin-top:5px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
  .overlay{position:fixed;inset:0;background:rgba(var(--scrim),0);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;pointer-events:none;will-change:background-color}
  .overlay.on{pointer-events:auto}
  .modal{background:var(--modal-bg);border-radius:18px;max-width:460px;width:100%;padding:20px 22px;box-shadow:var(--shadow-card);max-height:80vh;overflow:auto;opacity:0;will-change:transform,opacity,filter}
  .modal.drag{overflow:hidden}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .mhead h3{font-size:17px;font-weight:600;letter-spacing:-0.016em}
  .mclose{background:none;border:0;font-size:22px;color:var(--sub);cursor:pointer;line-height:1;padding:2px 6px}
  .mclose:focus{outline:none}
  .mclose:focus-visible{outline:2px solid var(--petrol);outline-offset:2px;border-radius:6px}
  .mitem{padding:12px 0;border-bottom:1px solid var(--line)}
  .mitem:last-child{border-bottom:0}
  .mname{font-weight:600;font-size:13.5px}
  .msub{color:var(--sub);font-size:12px;margin-top:2px}
  .mlink{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:600;text-decoration:none}
  .mlink:hover{text-decoration:underline}
  .defs{margin-top:10px}
  .defs summary{font-size:12px;color:var(--petrol);cursor:pointer;font-weight:600;user-select:none}
  .defsbody{margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--sub)}
  .defrow i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
  .defrow b{color:var(--ink);font-weight:600}
  .defsrow{display:flex;flex-direction:column;gap:2px;margin-top:16px;color:var(--sub);font-size:12px;line-height:1.6}
  .vrow{display:flex;gap:10px;align-items:flex-start;line-height:1.45}
  .vrow .chip{flex:none}
  .vnote{line-height:1.5;padding-top:2px}
  .defsbody{gap:9px}
  /* ---------- лоадер и состояния ---------- */
  .loader{margin-top:24px}
  .lcard{background:var(--card);border-radius:var(--r-card);box-shadow:0 0 0 var(--hair) var(--line);padding:38px 20px 34px;text-align:center}
  .spin{width:28px;height:28px;position:relative;display:inline-block}
  .spin i{position:absolute;left:50%;top:0;width:2.5px;height:8px;margin-left:-1.25px;border-radius:2px;background:var(--sub);transform-origin:50% 14px;animation:tick 1s linear infinite}
  @keyframes tick{0%{opacity:1}100%{opacity:.14}}
  .ltitle{font-weight:600;font-size:17px;letter-spacing:-0.016em;margin-top:14px}
  .lsub{color:var(--sub);font-size:13px;margin-top:5px;min-height:19px;transition:opacity .3s}
  .skel{margin-top:20px}
  .skgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
  .skrows{display:flex;flex-direction:column;gap:8px}
  .sk{box-shadow:0 0 0 var(--hair) var(--line);border-radius:var(--r-card);background:linear-gradient(100deg,var(--sk1) 20%,var(--sk2) 38%,var(--sk1) 60%);background-size:300% 100%;animation:shimmer 1.5s linear infinite}
  .sk.t{height:70px}
  .sk.r{height:62px}
  @keyframes shimmer{0%{background-position:150% 0}100%{background-position:-50% 0}}
  .ebadge{display:block;margin:0 auto 12px;width:40px;height:40px;color:var(--sub2)}
  .ebadge svg{width:100%;height:100%;display:block}
  .etitle{font-weight:600;font-size:17px;letter-spacing:-0.016em;color:var(--ink)}
  .esub{margin-top:6px;font-size:12.5px}
  .btn{margin-top:18px;background:var(--petrol);color:#fff;border:0;border-radius:99px;padding:9px 18px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;transition:transform .12s var(--ease),box-shadow .2s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(13,90,80,.22)}
  .btn:active{transform:none}
  #app.loaded{animation:fadeUp .45s var(--ease)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* ---------- свежесть данных ---------- */
  .fresh{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:600;background:var(--v-dev-bg);color:var(--v-dev);white-space:nowrap}
  .fresh.mid{background:var(--v-low-bg);color:var(--v-low)}
  .fresh.old{background:var(--v-fix-bg);color:var(--v-fix)}
  .stale{display:flex;gap:10px;align-items:flex-start;background:var(--v-fix-bg);color:var(--v-fix);border-radius:var(--r-card);padding:12px 15px;font-size:12.5px;line-height:1.45;margin-top:14px}
  .stale b{font-weight:600}
  .stale[hidden]{display:none}
  /* ---------- тултипы ---------- */
  .tip{position:fixed;left:0;top:0;z-index:80;background:var(--tip-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--tip-ink);font-size:12px;line-height:1.4;padding:7px 10px;border-radius:7px;pointer-events:none;opacity:0;max-width:270px;box-shadow:0 8px 24px rgba(20,35,31,.22);will-change:transform,opacity}
    .stack i{transition:opacity .18s}
  .stack:hover i{opacity:.45}
  .stack i:hover{opacity:1}
  .bar[data-tip],.stack i[data-tip],.chip[data-tip],.tot[data-tip]{cursor:help}
  .legend span{cursor:help;transition:color .18s}
  .legend span:hover{color:var(--ink)}
  .oline{border-radius:6px;padding:2px 4px;margin-left:-4px;margin-right:-4px;transition:background .18s}
  .oline:hover{background:var(--hover)}
  .cline{border-radius:6px;padding:2px 4px;margin-left:-4px;margin-right:-4px;transition:background .18s;cursor:help}
  .cline:hover{background:var(--hover)}
  
  .tot[data-tip]:hover{background:var(--hover)}
  .chip{white-space:nowrap}
  .chip .ce{display:none}
  .tot .lbl .ti{display:inline-flex;vertical-align:-2px;margin-right:7px;color:var(--sub2)}
  .tot .lbl .ti svg{width:13px;height:13px;display:block}
  /* ---------- дропдаун: бенчмарки, узкое место, сводка ---------- */
  .dwrap{background:var(--dwrap-bg)}
  .dwrap>div:nth-child(3){border-left:1px solid var(--line);padding-left:24px}
  .cline{grid-template-columns:82px 1fr 44px 92px}
  .cbench{font-size:11.5px;color:var(--sub);text-align:right;white-space:nowrap}
  .cbench.good{color:var(--v-dev)}
  .cbench.mid{color:var(--v-fix)}
  .cbench.bad{color:var(--v-stop)}
  .cbench.pale{color:var(--sub2)}
  .bmk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.28;border-radius:1px;z-index:2}
  .cline.weak{background:var(--v-fix-bg);box-shadow:inset 3px 0 0 var(--v-fix);padding-left:11px;margin-left:-11px}
  .cline.weak:hover{background:var(--v-fix-bg2)}
  .weakbadge{margin-left:8px;background:var(--v-fix-bg);color:var(--v-fix);border-radius:5px;padding:2px 7px;font-size:10px;letter-spacing:.03em;text-transform:none;font-weight:600}
  .oline{grid-template-columns:86px 1fr 60px}
  .onum small{color:var(--sub);font-weight:500;margin-left:5px;font-size:10.5px;font-family:'Inter',sans-serif}

    .head{grid-template-columns:1fr;grid-auto-rows:auto;position:relative;padding-right:38px}

  }

<body>
<div class="wrap">

<div id="app"><div class="loader">

    <div class="ltitle">Собираем статистику</div>

    <div class="skrows"><div class="sk r"></div><div class="sk r"></div><div class="sk r"></div><div class="sk r"></div></div>
  </div>
</div></div>
</div>
<script>
// ЕДИНСТВЕННАЯ настройка: URL веб-приложения Apps Script (шаг 1 в DEPLOY.md)
var DATA_URL='https://script.google.com/macros/s/AKfycbyp8f2Wm863NUdwwNJVOBHulM_KNKd8iLnXzCUwvkEUbPWM-5SfNoaxTtdv5OPM4MYIMg/exec';
var OUTCOMES = [
  {k:'meeting', name:'встреча',    c:'var(--c-meeting)'},
  {k:'positive',name:'интерес',    c:'var(--c-positive)'},
  {k:'referral',name:'рефералка',  c:'var(--c-referral)'},
  {k:'deferred',name:'отложено',   c:'var(--c-deferred)'},
  {k:'neutral', name:'нейтрально', c:'var(--c-neutral)'},
  {k:'refused', name:'отказ',      c:'var(--c-refused)'},
  {k:'optout',  name:'опт-аут',    c:'var(--c-optout)'}
];
// Монохромные символы вместо эмодзи: наследуют цвет подписи и не тянут
// на себя внимание, как цветная картинка посреди строки.
var SVG={
  sent:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M14.2 1.8 7.4 8.6M14.2 1.8l-4.4 12.4-2.4-5.6-5.6-2.4Z"/></svg>',
  acc:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.3"/><path d="m5.3 8.2 1.9 1.9 3.5-3.9"/></svg>',
  rep:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M14 9.2c0 1.1-.9 2-2 2H6.6L3 13.6v-2.4H4c-1.1 0-2-.9-2-2V4.4c0-1.1.9-2 2-2h8c1.1 0 2 .9 2 2Z"/></svg>',
  star:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m8 1.9 1.85 3.9 4.15.6-3 3 .71 4.28L8 11.66l-3.71 2.02L5 9.4l-3-3 4.15-.6Z"/></svg>',
  cal:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3.2" width="12" height="11" rx="2.4"/><path d="M2 6.6h12M5.4 1.8v2.6M10.6 1.8v2.6"/></svg>'
};
var VDEF={
  dev:'Верх воронки не хуже парка и positive-доля от 40% - можно лить больше',
  fix:'Одно звено заметно ниже бенчмарка парка либо positive-доля 15-40%',
  stop:'Провал на объёме - воронку стоит остановить и переложить контакты',
  low:'Выборки пока не хватает для вывода, воронка набирает данные'
};
var DEFS={meeting:'назначен продуктовый созвон или слот на Gamescom',positive:'живой интерес: вопросы по продукту, просьба цифр или материалов',referral:'продукт сам не берёт, но ушёл в реферальную программу',deferred:'отложил решение: «не сейчас, вернёмся позже» - тёплая база для ретача',neutral:'ответил вежливо, но без развития разговора',refused:'явный отказ от продукта: «не надо», «нерелевантно», «уже есть решение»',optout:'жёсткий стоп: «не пишите», жалоба'};
var LOADER_HTML='<div class="loader">\n  <div class="lcard">\n    <span class="spin" aria-hidden="true"><i style="transform:rotate(0deg);animation-delay:-.875s"></i><i style="transform:rotate(45deg);animation-delay:-.75s"></i><i style="transform:rotate(90deg);animation-delay:-.625s"></i><i style="transform:rotate(135deg);animation-delay:-.5s"></i><i style="transform:rotate(180deg);animation-delay:-.375s"></i><i style="transform:rotate(225deg);animation-delay:-.25s"></i><i style="transform:rotate(270deg);animation-delay:-.125s"></i><i style="transform:rotate(315deg);animation-delay:0s"></i></span>\n    <div class="ltitle">Собираем статистику</div>\n    <div class="lsub" id="lsub">Тянем свежий прогон…</div>\n  </div>\n  <div class="skel">\n    <div class="skgrid"><div class="sk t"></div><div class="sk t"></div><div class="sk t"></div><div class="sk t"></div><div class="sk t"></div></div>\n    <div class="skrows"><div class="sk r"></div><div class="sk r"></div><div class="sk r"></div><div class="sk r"></div></div>\n  </div>\n</div>';
var SCRIM='20,35,31',SCRIM_A=0.42;
function readScrim(){var cs=getComputedStyle(document.documentElement);
  SCRIM=(cs.getPropertyValue('--scrim')||'20,35,31').trim();
  SCRIM_A=parseFloat(cs.getPropertyValue('--scrim-a'))||0.42;}
readScrim();
var LAST_D=null;

// ============================================================
// ДВИЖОК ПРУЖИН. Параметры как у Apple: response (за сколько секунд
// дойти до цели) и damping ratio (1.0 - без перелёта, 0.8 - лёгкий отскок).
// Пружина всегда стартует от ТЕКУЩЕГО значения и текущей скорости,
// поэтому любую анимацию можно перехватить и развернуть на полпути.
// ============================================================
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var SPRINGS=[],RAF=null,lastT=0;
function Spring(value,onUpdate,opts){
  this.x=value;this.v=0;this.target=value;this.on=onUpdate;
  this.response=(opts&&opts.response)||0.4;this.damping=(opts&&opts.damping!=null)?opts.damping:1;
  this.eps=(opts&&opts.eps)||0.05;this.active=false;this.onRest=null;
}
Spring.prototype.set=function(target,o){
  o=o||{};this.target=target;
  if(o.velocity!=null)this.v=o.velocity;
  if(o.response)this.response=o.response;
  if(o.damping!=null)this.damping=o.damping;
  this.onRest=o.onRest||null;
  if(RM||o.immediate){this.jump(target);return this;}
  if(!this.active){this.active=true;SPRINGS.push(this);}
  if(!RAF)RAF=requestAnimationFrame(tickAll);
  return this;
};
Spring.prototype.jump=function(v){
  this.x=this.target=v;this.v=0;this.active=false;
  var i=SPRINGS.indexOf(this);if(i>-1)SPRINGS.splice(i,1);
  this.on(this.x);if(this.onRest){var f=this.onRest;this.onRest=null;f();}
};
function tickAll(t){
  RAF=null;
  var dt=lastT?Math.min(0.064,(t-lastT)/1000):0.016;lastT=t;
  for(var i=SPRINGS.length-1;i>=0;i--){
    var s=SPRINGS[i],k=Math.pow(2*Math.PI/s.response,2),c=4*Math.PI*s.damping/s.response,h=dt/4;
    for(var j=0;j<4;j++){s.v+=(-k*(s.x-s.target)-c*s.v)*h;s.x+=s.v*h;}
    if(Math.abs(s.v)<s.eps&&Math.abs(s.x-s.target)<s.eps){
      s.x=s.target;s.v=0;s.active=false;SPRINGS.splice(i,1);s.on(s.x);
      if(s.onRest){var f=s.onRest;s.onRest=null;f();}
    }else s.on(s.x);
  }
  if(SPRINGS.length)RAF=requestAnimationFrame(tickAll);else lastT=0;
}
// куда долетит жест, если отпустить (та же формула, что у инерции скролла)
function project(v,rate){rate=rate||0.998;return (v/1000)*rate/(1-rate);}
// сопротивление за границей: чем дальше тянут, тем меньше идёт следом
function rubberband(over,dim,c){c=c||0.55;return (over*dim*c)/(dim+c*Math.abs(over));}

// ---------- отклик на нажатие: подсветка на pointer-down, отмена при уводе пальца ----------
document.addEventListener('pointerdown',function(e){
  if(e.button)return;
  var t=e.target.closest?e.target.closest('.head,.tot.clickable,.btn,.totop,.flink a,.mclose'):null;
  if(!t)return;
  t.classList.add('is-down');
  var x0=e.clientX,y0=e.clientY;
  function off(){t.classList.remove('is-down');window.removeEventListener('pointerup',off);window.removeEventListener('pointercancel',off);window.removeEventListener('pointermove',mv);}
  function mv(ev){if(Math.abs(ev.clientX-x0)>10||Math.abs(ev.clientY-y0)>10)off();}
  window.addEventListener('pointerup',off);window.addEventListener('pointercancel',off);window.addEventListener('pointermove',mv);
});

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function pct(a,b){return b?Math.round(a/b*100):0;}
function fname(n){return esc(n).split(' | ').join('<span class="sep">|</span>');}
function bmk(w){return (w!=null&&w>0&&w<100)?'<i class="bmk" style="left:'+w+'%"></i>':'';}
function bench(v,p,suffix,ok){
  if(p==null)return '<span class="cbench">'+v+suffix+'</span>';
  var c=ok?(v>=p?' good':(v<0.7*p?' bad':' mid')):' pale';
  return '<span class="cbench'+c+'">'+v+'% · ср '+p+'%</span>';
}
function vchip(f){return '<span class="chip '+esc(f.verdict)+'" data-tip="'+esc(VDEF[f.verdict]||'')+'">'+esc(f.vtext)+'</span>';}


// ---------- загрузка ----------
var LSTEPS=['Тянем свежий прогон…','считаем конверсии...','раскладываем исходы...'];
var lstep=null;
function spinLoader(){
  var i=0,el=document.getElementById('lsub');
  clearInterval(lstep);
  if(!el)return;
  lstep=setInterval(function(){
    i=(i+1)%LSTEPS.length;
    el.style.opacity=0;
    setTimeout(function(){el.textContent=LSTEPS[i];el.style.opacity=1;},260);
  },1400);
}
function showLoader(){
  var app=document.getElementById('app');
  app.classList.remove('loaded');
  app.innerHTML=LOADER_HTML;
  spinLoader();
}
function showError(msg){
  clearInterval(lstep);
  var app=document.getElementById('app');
  app.classList.add('loaded');
  app.innerHTML='<div class="empty"><span class="ebadge"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22a22 22 0 0 1 32 0"/><path d="M10 28a14 14 0 0 1 20 0"/><circle cx="20" cy="34" r="1.6" fill="currentColor" stroke="none"/><path d="m32 8-24 24"/></svg></span><div class="etitle">Не получилось загрузить данные</div><div class="esub">'+esc(msg)+'</div><button class="btn" id="retry" type="button">Попробовать снова</button></div>';
  document.getElementById('meta').textContent='Связи нет';

function boot(){
  fetch(DATA_URL,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){clearInterval(lstep);render(d);})
    .catch(function(e){showError(e.message||'неизвестная ошибка');});
}

// ---------- время последнего прогона ----------
function parseUpd(v){
  if(!v)return null;
  var s=String(v).trim(),m;
  m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})(?:[\s,]+(\d{1,2}):(\d{2}))?/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1],m[4]?+m[4]:12,m[5]?+m[5]:0);
  m=s.match(/^(\d{1,2})[.\/](\d{1,2})(?:[\s,]+(\d{1,2}):(\d{2}))?$/);
  if(m)return new Date((new Date()).getFullYear(),+m[2]-1,+m[1],m[3]?+m[3]:12,m[4]?+m[4]:0);
  var d=new Date(s);
  return isNaN(d.getTime())?null:d;
}
function plural(n,a,b,c){var d=n%10,h=n%100;return (d==1&&h!=11)?a:((d>=2&&d<=4&&(h<10||h>=20))?b:c);}
function ago(dt){
  var s=Math.floor((Date.now()-dt.getTime())/1000);
  if(s<0)s=0;
  if(s<120)return 'только что';
  if(s<3600){var mi=Math.round(s/60);return mi+' '+plural(mi,'минуту','минуты','минут')+' назад';}
  if(s<86400){var h=Math.round(s/3600);return h+' '+plural(h,'час','часа','часов')+' назад';}
  var dd=Math.floor(s/86400);
  if(dd===1)return 'вчера';
  return dd+' '+plural(dd,'день','дня','дней')+' назад';
}
function paintMeta(){
  var d=LAST_D;if(!d)return;
  var upd=parseUpd(d.updated),chip='',st=document.getElementById('stale');
  if(upd){
    var h=(Date.now()-upd.getTime())/3600000;
    chip='<span class="fresh'+(h<12?'':(h<24?' mid':' old'))+'">'+ago(upd)+'</span>';
  }
  document.getElementById('meta').innerHTML='Обновлено <b>'+esc(d.updated)+'</b>'+chip;
  if(upd&&Date.now()-upd.getTime()>86400000){
    st.hidden=false;
    st.innerHTML='<span>⏳</span><span>Данные старше суток: последний прогон <b>'+esc(d.updated)+'</b> ('+ago(upd)+'). Похоже, вечерний прогон не прошёл - цифры ниже устарели.</span>';
  }else{st.hidden=true;st.innerHTML='';}
}
setInterval(paintMeta,60000);

// ---------- тултипы ----------
var TIP=null,tipSp=null,tipAnchor=null;
function hideTip(){if(tipAnchor){tipAnchor=null;tipSp.set(0,{response:0.22});}}
function initTip(){
  if(window.matchMedia&&!matchMedia('(hover: hover)').matches)return;
  TIP=document.createElement('div');TIP.className='tip';document.body.appendChild(TIP);
  // подсказка не всплывает откуда-то, а вырастает из того элемента, который объясняет
  tipSp=new Spring(0,function(p){
    TIP.style.opacity=Math.max(0,Math.min(1,p));
    TIP.style.transform='scale('+(0.92+0.08*p)+') translateY('+(3*(1-p))+'px)';
  },{response:0.26,damping:1,eps:0.002});
  document.addEventListener('mouseover',function(e){
    var t=(e.target&&e.target.closest)?e.target.closest('[data-tip]'):null;
    if(!t){hideTip();return;}
    if(t===tipAnchor)return;
    tipAnchor=t;
    TIP.textContent=t.getAttribute('data-tip');
    var r=t.getBoundingClientRect();
    TIP.style.transform='none';
    var b=TIP.getBoundingClientRect();
    var left=Math.max(8,Math.min(r.left+r.width/2-b.width/2,window.innerWidth-b.width-8));
    var top=r.top-b.height-8,below=false;
    if(top<8){top=r.bottom+8;below=true;}
    TIP.style.left=left+'px';TIP.style.top=top+'px';
    TIP.style.transformOrigin=(r.left+r.width/2-left)+'px '+(below?'0':'100%');
    tipSp.set(1,{response:0.26});
  });
  document.addEventListener('mouseout',function(e){
    var t=(e.target&&e.target.closest)?e.target.closest('[data-tip]'):null;
    if(t)hideTip();
  });
  window.addEventListener('scroll',hideTip,{passive:true});
}

// ---------- тема: видимый сегментированный переключатель ----------
var TH_ICON={
  light:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.4M8 13.1v1.4M14.5 8h-1.4M2.9 8H1.5M12.6 3.4l-1 1M4.4 11.6l-1 1M12.6 12.6l-1-1M4.4 4.4l-1-1"/></svg>',
  dark:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.3 9.5A5.7 5.7 0 0 1 6.5 2.7a5.7 5.7 0 1 0 6.8 6.8Z"/></svg>',
  auto:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.2"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4Z" fill="currentColor" stroke="none"/></svg>'
};
var TH_LABEL={light:'Светлая',dark:'Тёмная',auto:'Авто'};
var TH_TIP={light:'Всегда светлое оформление',dark:'Всегда тёмное оформление',auto:'Как в системе'};

// Бегунок сегмента едет пружиной и всегда стартует с текущего места,
// поэтому быстрые переключения не дёргаются.
function initSeg(seg,order,start,onChange){
  var thumb=seg.querySelector('.thumb');
  var x=new Spring(0,function(v){thumb.style.transform='translateX('+v+'px)';},{response:0.32,damping:1,eps:0.1});
  var w=new Spring(40,function(v){thumb.style.width=v+'px';},{response:0.32,damping:1,eps:0.1});
  var btns=order.map(function(k){
    var b=document.createElement('button');b.type='button';b.dataset.v=k;
    b.innerHTML=TH_ICON[k]+'<span class="lab">'+TH_LABEL[k]+'</span>';
    b.setAttribute('data-tip',TH_TIP[k]);
    seg.appendChild(b);return b;
  });
  var cur=btns[Math.max(0,order.indexOf(start))];
  function place(b,imm){
    var r=b.getBoundingClientRect(),s=seg.getBoundingClientRect();
    if(!r.width)return;
    x.set(r.left-s.left-2,{immediate:imm});w.set(r.width,{immediate:imm});
  }
  btns.forEach(function(b){
    b.setAttribute('aria-pressed',b===cur?'true':'false');
    b.addEventListener('click',function(){
      if(b===cur)return;
      cur.setAttribute('aria-pressed','false');cur=b;b.setAttribute('aria-pressed','true');
      place(b,false);hideTip();onChange(b.dataset.v);
    });
  });
  requestAnimationFrame(function(){place(cur,true);});
  window.addEventListener('resize',function(){place(cur,true);});
}

function initTheme(){
  var seg=document.getElementById('theme');
  var mode='light';   // дефолт проекта - светлая тема, не системная
  try{var v=localStorage.getItem('theme');if(v==='light'||v==='dark'||v==='auto')mode=v;}catch(e){}
  var sysDark=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
  function paint(){
    var eff=(mode==='auto')?((sysDark&&sysDark.matches)?'dark':'light'):mode;
    document.documentElement.setAttribute('data-theme',eff);
    readScrim();
    try{localStorage.setItem('theme',mode);}catch(e){}
  }
  paint();
  if(seg)initSeg(seg,['light','dark','auto'],mode,function(v){mode=v;paint();});
  if(sysDark&&sysDark.addEventListener)sysDark.addEventListener('change',function(){if(mode==='auto')paint();});
}

// ---------- кнопка наверх ----------
function initUp(){
  var b=document.createElement('button');
  b.className='totop';b.type='button';b.setAttribute('aria-label','Наверх');b.innerHTML='↑';
  document.body.appendChild(b);
  b.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
  window.addEventListener('scroll',function(){b.classList.toggle('show',window.pageYOffset>450);},{passive:true});
}

initTheme();spinLoader();initTip();initUp();boot();

    +'<div class="vrow"><span class="chip stop">ТОРМОЗИТЬ</span><span>провал на объёме: positive-доля ниже 15% или акцепт вдвое ниже среднего при 100+ отправках</span></div>'

  html+='</div>';
  app.innerHTML=html;

  var rowsEl=document.getElementById('rows');
  d.funnels.forEach(function(f,fidx){

    var pos=o.meeting+o.positive+o.referral;
    var posShare=pct(pos,f.rep);
    var maxO=Math.max(1,o.meeting,o.positive,o.referral,o.neutral,o.refused,o.optout);
    var row=document.createElement('div');
    row.className='row';
    var h='';

    var prog=(f.base?pct(f.sent,f.base):null);
    var progCls=(prog==null?'':(prog>=80?' hi':(prog<30?' lo':'')));
    var progChip=(prog==null?'':'<span class="fprog'+progCls+'" data-tip="Обработано '+f.sent+' из '+f.base+' контактов базы">'+prog+'%</span>');
    h+='<span><span class="fname">'+fname(f.name)+progChip+'</span></span>';
    h+='<span><span class="bar" data-tip="Отправлено '+f.sent+' → приняли '+f.acc+' ('+pct(f.acc,f.sent)+'%) → ответили '+f.rep+' ('+pct(f.rep,f.acc)+'% от принявших)"><span class="fill acc" data-w="'+pct(f.acc,f.sent)+'"></span><span class="fill rep" data-w="'+pct(f.rep,f.sent)+'"></span></span>';
    h+='<span class="nums"><span>отпр <b>'+f.sent+'</b></span><span>прин <b>'+f.acc+'</b> · '+pct(f.acc,f.sent)+'%</span><span>отв <b>'+f.rep+'</b> · '+pct(f.rep,f.acc)+'%</span></span></span>';
    h+='<span><span class="stack">'+OUTCOMES.map(function(x){return '<i style="background:'+x.c+'" data-fb="'+(f.rep?o[x.k]/f.rep*100:0)+'" data-tip="'+x.name+' · '+o[x.k]+' из '+f.rep+' ('+pct(o[x.k],f.rep)+'% ответов)"></i>';}).join('')+'</span>';
    h+='<span class="posline">positive <b>'+posShare+'%</b>'+(f.note?' · '+esc(f.note):'')+'</span></span>';
    h+='<span class="verdict">'+vchip(f)+'</span>';
    h+='<span class="chev" aria-hidden="true"></span></button>';
    h+='<div class="detail"><div class="dinner"><div class="dwrap">';
    h+='<div class="dverdict">'+vchip(f)+'<span class="dwhy">'+esc(f.why)+'</span></div>';
    var pACC=(t.acc_pct!=null?t.acc_pct:null), pRR=(t.rep_pct!=null?t.rep_pct:null), pPS=(t.pos_share!=null?t.pos_share:null);
    var accP=pct(f.acc,f.sent), repP=pct(f.rep,f.acc);
    var weak='';
    if(pACC&&f.sent>=30&&accP<0.7*pACC)weak='acc';
    else if(pRR&&f.acc>=10&&repP<0.7*pRR)weak='rep';
    else if(f.rep>=5&&posShare<40)weak='q';
    var wbadge='<span class="weakbadge">узкое место</span>';
    var scale=(f.base?f.base:f.sent);
    h+='<div><div class="dh">Каскад воронки'+((weak==='acc'||weak==='rep')?wbadge:'')+'</div>';
    if(f.base){
      h+='<div class="cline" data-tip="Всего контактов залито в воронку: '+f.base+'"><span class="clbl">база</span><span class="bar"><span class="fill" style="background:var(--bar1)" data-w="100"></span></span><span class="cnum">'+f.base+'</span><span class="cbench">залито</span></div>';
    }
    h+='<div class="cline" data-tip="'+(f.base?('Отправлено '+f.sent+' из '+f.base+' контактов базы ('+pct(f.sent,f.base)+'%)'):('Отправлено инвайтов: '+f.sent))+'"><span class="clbl">отправлено</span><span class="bar"><span class="fill" style="background:var(--bar2)" data-w="'+(f.base?pct(f.sent,f.base):100)+'"></span></span><span class="cnum">'+f.sent+'</span><span class="cbench">'+(f.base?pct(f.sent,f.base)+'% базы':'вся база')+'</span></div>';
    h+='<div class="cline'+(weak==='acc'?' weak':'')+'" data-tip="Приняли инвайт: '+f.acc+' - '+accP+'% от отправленных'+(pACC!=null?', среднее по воронкам '+pACC+'%':'')+(f.sent<30?'. Выборки мало для сравнения - нужно от 30 отправок':'')+'"><span class="clbl">принято</span><span class="bar"><span class="fill acc" data-w="'+pct(f.acc,scale)+'"></span>'+bmk(pACC!=null?pct(Math.round(f.sent*pACC/100),scale):null)+'</span><span class="cnum">'+f.acc+'</span>'+bench(accP,pACC,'% отпр',f.sent>=30)+'</div>';
    h+='<div class="cline'+(weak==='rep'?' weak':'')+'" data-tip="Ответили: '+f.rep+' - '+repP+'% от принявших'+(pRR!=null?', среднее по воронкам '+pRR+'%':'')+(f.acc<10?'. Выборки мало для сравнения - нужно от 10 принявших':'')+'"><span class="clbl">ответили</span><span class="bar"><span class="fill rep" data-w="'+pct(f.rep,scale)+'"></span>'+bmk(pRR!=null?pct(Math.round(f.acc*pRR/100),scale):null)+'</span><span class="cnum">'+f.rep+'</span>'+bench(repP,pRR,'% прин',f.acc>=10)+'</div></div>';
    h+='<div><div class="dh">Исходы ответов'+(weak==='q'?wbadge:'')+'</div>';
    h+=OUTCOMES.map(function(x){var n=o[x.k];return '<div class="oline'+(n?'':' zero')+'" data-tip="'+esc(x.name+' - '+DEFS[x.k])+'"><span class="olbl"><i style="background:'+x.c+'"></i>'+x.name+'</span><span class="bar"><span class="fill" style="background:'+x.c+'" data-w="'+(f.rep?n/f.rep*100:0)+'"></span></span><span class="onum">'+n+'<small>'+pct(n,f.rep)+'%</small></span></div>';}).join('');
    if(f.rep){
      var negN=o.neutral+o.refused+o.optout;
      h+='<div class="osum">'
        +'<div class="os pos" data-tip="Встречи, интерес и рефералки - главная метрика качества"><b>'+pos+'</b><span>positive '+posShare+'%'+(pPS!=null?' · ср '+pPS+'%':'')+'</span></div>'
        +'<div class="os def" data-tip="Перенос по времени, не отказ - тёплая база для ретача"><b>'+o.deferred+'</b><span>отложено '+pct(o.deferred,f.rep)+'%</span></div>'
        +'<div class="os neg" data-tip="Нейтральные, отказы и опт-ауты"><b>'+negN+'</b><span>не сработало '+pct(negN,f.rep)+'%</span></div>'
        +'</div>';
      if(f.rep>=5&&pct(o.deferred,f.rep)>=30){
        h+='<div class="ohint">Отложенный спрос: '+o.deferred+' лидов ждут ретача - планировать возврат</div>';
      }
    }
    h+='</div>';
    if(f.uuid){
      h+='<div class="flink"><span class="uuid mono">'+esc(f.uuid.slice(0,8))+'</span><a href="https://amazing.getsales.io/flow/'+esc(f.uuid)+'/builder" target="_blank" rel="noopener">Открыть воронку в GetSales →</a></div>';
    }
    h+='</div></div></div>';
    row.innerHTML=h;
    rowsEl.appendChild(row);
    var head=row.querySelector('.head');
    var detail=row.querySelector('.detail'),dinner=row.querySelector('.dinner'),chev=row.querySelector('.chev');
    // одна пружина ведёт и высоту, и поворот шеврона: стрелка всё время
    // показывает, куда идёт движение, а не щёлкает в конце
    var open=false;
    var hsp=new Spring(0,function(p){
      detail.style.height=(p*dinner.offsetHeight)+'px';
      chev.style.transform='rotate('+(180*Math.max(0,Math.min(1,p)))+'deg)';
    },{response:0.36,damping:1,eps:0.004});
    var dfills=[].slice.call(detail.querySelectorAll('.fill')).map(function(el){
      return {w:+el.dataset.w,sp:new Spring(0,function(v){el.style.width=v+'%';},{response:0.7,damping:1,eps:0.05})};
    });
    head.addEventListener('click',function(){
      open=!open;
      row.classList.toggle('open',open);
      head.setAttribute('aria-expanded',open);
      if(open){
        detail.style.height=(hsp.x*dinner.offsetHeight)+'px';
        hsp.set(1,{onRest:function(){if(open)detail.style.height='auto';}});
        dfills.forEach(function(f,i){setTimeout(function(){if(open)f.sp.set(f.w);},60+i*22);});
      }else{
        if(detail.style.height==='auto')detail.style.height=dinner.offsetHeight+'px';
        hsp.set(0);
        dfills.forEach(function(f){f.sp.set(0,{response:0.3});});
      }
    });
    window.addEventListener('resize',function(){if(open&&detail.style.height!=='auto')detail.style.height=dinner.offsetHeight+'px';});
  });

  if(d.meetings_list&&d.meetings_list.length){
    var ov=document.createElement('div');
    ov.className='overlay';
    var items=d.meetings_list.map(function(m){
      return '<div class="mitem"><div class="mname">'+esc(m.name)+'</div><div class="msub">'+esc(m.funnel||'')+(m.where?' · '+esc(m.where):'')+'</div>'+(m.url?'<a class="mlink" href="'+esc(m.url)+'" target="_blank" rel="noopener">'+(m.url.indexOf('linkedin.com/in/')>-1?'Профиль в LinkedIn →':'Открыть переписку →')+'</a>':'')+'</div>';
    }).join('');
    ov.innerHTML='<div class="modal"><div class="mhead"><h3>Назначенные встречи</h3><button class="mclose" aria-label="Закрыть">×</button></div>'+items+'</div>';
    document.body.appendChild(ov);
    var modal=ov.querySelector('.modal');
    var isMobile=function(){return window.innerWidth<=700;};
    var MH=function(){return modal.getBoundingClientRect().height||360;};
    var opened=false;
    // p: 1 - открыто, 0 - закрыто. Одно значение и на десктопе, и на мобиле,
    // поэтому жест и анимация - это одно и то же движение, а не два разных.
    var msp=new Spring(0,function(p){
      ov.style.background='rgba('+SCRIM+','+(SCRIM_A*Math.max(0,Math.min(1,p))).toFixed(3)+')';
      if(isMobile()){
        modal.style.opacity=p>0.01?1:0;
        modal.style.filter='';
        modal.style.transform='translateY('+((1-Math.min(1.2,p))*MH())+'px)';
      }else{
        var pp=Math.max(0,Math.min(1,p));
        modal.style.opacity=pp;
        // карточка не выцветает, а именно материализуется: масштаб и резкость вместе
        modal.style.transform='scale('+(0.95+0.05*pp)+')';
        modal.style.filter=pp<0.98?'blur('+(5*(1-pp))+'px)':'';
      }
    },{response:0.32,damping:1,eps:0.002});
    function show(){opened=true;ov.classList.add('on');msp.set(1,{response:0.34,damping:1});ov.querySelector('.mclose').focus({preventScroll:true});}
    function hide(o){o=o||{};opened=false;msp.set(0,{response:o.response||0.3,damping:o.damping!=null?o.damping:1,velocity:o.velocity,onRest:function(){ov.classList.remove('on');}});}
    var mtot=document.getElementById('tot-meetings');
    if(mtot){mtot.addEventListener('click',show);}
    ov.addEventListener('click',function(e){if(e.target===ov)hide();});
    ov.querySelector('.mclose').addEventListener('click',function(){hide();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&opened)hide();});

    // ---------- жест: карточка едет 1:1 за пальцем, отпускание передаёт скорость ----------
    var drag=null;
    modal.addEventListener('pointerdown',function(e){
      if(!isMobile()||e.button)return;
      if(modal.scrollTop>0)return;               // прокрученный список отдаёт жест себе
      drag={id:e.pointerId,y0:e.clientY,p0:msp.x,hist:[[e.clientY,performance.now()]],moved:false};
      modal.setPointerCapture(e.pointerId);
      msp.onRest=null;msp.jump(msp.x);msp.target=msp.x;   // перехват на лету
      opened=true;modal.classList.add('drag');
    });
    modal.addEventListener('pointermove',function(e){
      if(!drag||e.pointerId!==drag.id)return;
      var dy=e.clientY-drag.y0,h=MH();
      if(!drag.moved&&Math.abs(dy)<10)return;    // гистерезис, чтобы не ловить тап
      drag.moved=true;
      drag.hist.push([e.clientY,performance.now()]);while(drag.hist.length>6)drag.hist.shift();
      var p=drag.p0-dy/h;
      if(p>1)p=1+rubberband(p-1,1,0.45);         // выше верха тянется всё туже
      msp.x=p;msp.target=p;msp.on(p);
      if(modal.scrollTop>0)modal.scrollTop=0;
      e.preventDefault();
    },{passive:false});
    function release(e){
      if(!drag||e.pointerId!==drag.id)return;
      var d=drag;drag=null;modal.classList.remove('drag');
      if(!d.moved)return;
      var h=MH(),a=d.hist[0],b=d.hist[d.hist.length-1];
      var vy=(b[0]-a[0])/Math.max(1,b[1]-a[1])*1000;   // px/s
      var vp=-vy/h;
      var projected=msp.x-project(vy)/h;               // куда долетит по инерции
      var close=Math.abs(vy)>250?vy>0:projected<0.5;   // при заметной скорости решает знак, а не позиция
      if(close)hide({velocity:vp,damping:0.8,response:0.3});
      else{opened=true;msp.set(1,{velocity:vp,damping:0.8,response:0.3});}
    }
    modal.addEventListener('pointerup',release);
    modal.addEventListener('pointercancel',release);
    window.addEventListener('resize',function(){msp.jump(opened?1:0);});
  }

  requestAnimationFrame(function(){
    var rows=[].slice.call(document.querySelectorAll('.row'));
    rows.forEach(function(r,ri){
      var delay=Math.min(ri,8)*40;
      r.querySelectorAll('.head .fill').forEach(function(el){
        var sp=new Spring(0,function(v){el.style.width=v+'%';},{response:0.7,damping:1,eps:0.05});
        setTimeout(function(){sp.set(+el.dataset.w);},delay);
      });
      r.querySelectorAll('.head .stack i').forEach(function(el){
        var sp=new Spring(0,function(v){el.style.flexBasis=v+'%';},{response:0.7,damping:1,eps:0.05});
        setTimeout(function(){sp.set(+el.dataset.fb);},delay);
      });
    });
    document.body.classList.add('ready');
  });
}
function totMeet(val,list){
  var has=list&&list.length;
  return '<div class="tot hero'+(has?' clickable':'')+'" id="tot-meetings"'+(has?' data-tip="Клик - список встреч со ссылками на профили"':'')+'><div class="lbl"><i class="ti">'+SVG.cal+'</i>Встреч назначено</div><div class="val">'+(val==null?'-':val)+'</div>'+(has?'<div class="more">подробнее →</div>':'')+'</div>';
}
function tot(lbl,val,small,icon,hero,tip){
  return '<div class="tot'+(hero?' hero':'')+'"'+(tip?' data-tip="'+esc(tip)+'"':'')+'><div class="lbl"><i class="ti">'+(icon||'')+'</i>'+lbl+'</div><div class="val">'+(val==null?'-':val)+(small?'<small>'+small+'</small>':'')+'</div></div>';
}
